name: wvab_mobile
description: Accessibility-first Android companion for Wireless Vision-Aid for the Blind.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: 3.47.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: ".generated/wvab_launcher.png"
  min_sdk_android: 24
  adaptive_icon_background: "#07112F"
  adaptive_icon_foreground: ".generated/wvab_launcher_foreground.png"

flutter:
  uses-material-design: true
