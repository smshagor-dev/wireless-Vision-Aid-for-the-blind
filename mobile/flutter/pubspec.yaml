name: wvab_mobile
description: Standalone offline Android runtime for Wireless Vision-Aid for the Blind.
publish_to: "none"
version: 0.2.2+4

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: 3.47.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  flutter_tts: ^4.2.5
  flutter_onnxruntime: ^1.8.4
  shared_preferences: ^2.5.5
  flutter_secure_storage: 10.2.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: ".generated/wvab_launcher.png"
  min_sdk_android: 24
  adaptive_icon_background: "#07112F"
  adaptive_icon_foreground: ".generated/wvab_launcher_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
