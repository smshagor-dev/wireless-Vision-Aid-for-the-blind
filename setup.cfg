[metadata]
name = wvab-system
version = 2.0.0
description = Offline-first computer-vision assistance platform for blind and low-vision users
long_description = file: Readme.md
long_description_content_type = text/markdown
author = Md. Shahanur Islam Shagor
license = MIT
license_files = LICENSE
url = https://github.com/smshagor-dev/wireless-Vision-Aid-for-the-blind
project_urls =
    Source = https://github.com/smshagor-dev/wireless-Vision-Aid-for-the-blind
    Issues = https://github.com/smshagor-dev/wireless-Vision-Aid-for-the-blind/issues
    Security Policy = https://github.com/smshagor-dev/wireless-Vision-Aid-for-the-blind/blob/main/SECURITY.md
    Releases = https://github.com/smshagor-dev/wireless-Vision-Aid-for-the-blind/releases
keywords =
    accessibility
    assistive-technology
    computer-vision
    edge-ai
    esp32-cam
    raspberry-pi
    yolo
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
python_requires = >=3.10
packages = find:
include_package_data = True
zip_safe = False
py_modules =
    main
    vision_server
    udp_streaming
    navigation_pipeline
    metrics
    offline_utils
    export_accelerated_models
    smartphone_camera
    train_navigation_model
    test_system
install_requires =
    opencv-python>=4.8,<5
    ultralytics>=8.2,<9
    torch>=2.2,<3
    torchvision>=0.17,<1
    timm>=0.9,<2
    numpy>=1.24,<3
    pyttsx3>=2.90,<3
    urllib3>=2.2,<3
    requests>=2.31,<3
    Pillow>=10,<12
    pycryptodome>=3.20,<4
    websockets>=12,<16
    pyyaml>=6,<7
    psutil>=5.9,<8
    prometheus-client>=0.20,<1

[options.packages.find]
include =
    assets
    core
    mapping
    navigation
    perception
    training
    tools

[options.package_data]
assets =
    fonts/*.ttf

[options.extras_require]
accelerators =
    onnx>=1.12,<2
    onnxslim>=0.1.82,<1
    openvino>=2024,<2027

[options.entry_points]
console_scripts =
    wvab = main:main
