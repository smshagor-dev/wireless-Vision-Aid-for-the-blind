[metadata]
name = wvab-system
version = 1.0.1
description = Wireless Vision-Aid for the Blind (WVAB)
author = Md. Shahanur Islam Shagor
license = MIT
long_description = file: Readme.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.10
py_modules =
    vision_server
    udp_streaming
    navigation_pipeline
    metrics
    offline_utils
    export_accelerated_models
    smartphone_camera
    train_navigation_model
    test_system
install_requires =
    opencv-python>=4.8,<5
    ultralytics>=8.2,<9
    torch>=2.2,<3
    torchvision>=0.17,<1
    timm>=0.9,<2
    numpy>=1.24,<3
    pyttsx3>=2.90,<3
    urllib3>=2.2,<3
    requests>=2.31,<3
    Pillow>=10,<12
    pycryptodome>=3.20,<4
    websockets>=12,<16
    pyyaml>=6,<7
    psutil>=5.9,<8
    prometheus-client>=0.20,<1

[options.extras_require]
accelerators =
    onnx>=1.12,<2
    onnxslim>=0.1.82,<1
    openvino>=2024,<2027
