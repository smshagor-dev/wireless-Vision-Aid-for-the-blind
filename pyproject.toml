[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# Package metadata and runtime dependencies live in setup.cfg. Keeping PEP 621
# metadata out of this file avoids two competing sources of package metadata.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires full WVAB runtime dependencies and device/model access",
]
