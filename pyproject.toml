[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wvab-system"
version = "1.0.1"
description = "Wireless Vision-Aid for the Blind (WVAB)"
authors = [
  { name = "Md. Shahanur Islam Shagor" }
]
readme = "Readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires full WVAB runtime dependencies and device/model access",
]
