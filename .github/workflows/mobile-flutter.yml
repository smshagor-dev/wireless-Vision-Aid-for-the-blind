name: Mobile Flutter

on:
  push:
    branches:
      - main
    paths:
      - mobile/flutter/**
      - .github/workflows/mobile-flutter.yml
  pull_request:
    paths:
      - mobile/flutter/**
      - .github/workflows/mobile-flutter.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-mobile:
    name: Flutter analyze, test, and debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Generate Android host project and launcher branding
        run: bash tool/bootstrap_android.sh

      - name: Verify Android security, SDK, and branding contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'minSdk = 24' android/app/build.gradle.kts >/dev/null
          grep -F 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:label="WVAB"' android/app/src/main/AndroidManifest.xml >/dev/null
          test -s .generated/wvab_launcher.png
          test -s .generated/wvab_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              Path('.generated/wvab_launcher.png'): '3dd7859dabcc70ea7b5b8069b46b532a85924239b29d27e7aa7344ebe6467c43',
              Path('.generated/wvab_launcher_foreground.png'): '97aea4f3229f4fef747ab1d531dfec8e2bd3df5ea12157d5f3865190f10ea574',
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'{path} checksum mismatch: {actual}')
          PY

      - name: Build split debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-debug.apk
          test "$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk)" -lt 104857600

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wvab-mobile-debug-${{ github.sha }}
          path: mobile/flutter/build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
          retention-days: 7
