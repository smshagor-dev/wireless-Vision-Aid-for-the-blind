name: Mobile Flutter

on:
  push:
    branches:
      - main
    paths:
      - mobile/flutter/**
      - yolov8n.pt
      - .github/workflows/mobile-flutter.yml
  pull_request:
    paths:
      - mobile/flutter/**
      - yolov8n.pt
      - .github/workflows/mobile-flutter.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-mobile:
    name: Flutter analyze, test, and standalone debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mobile/flutter/tool/model-export-requirements.txt

      - name: Install pinned mobile model exporter
        run: python -m pip install --disable-pip-version-check -r tool/model-export-requirements.txt

      - name: Export and validate offline ONNX model
        run: python tool/export_mobile_model.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Generate Android host project and launcher branding
        run: bash tool/bootstrap_android.sh

      - name: Verify Android, branding, and offline-model contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'minSdk = 24' android/app/build.gradle.kts >/dev/null
          grep -F 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:label="WVAB"' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'assets/models/' pubspec.yaml >/dev/null
          test -s assets/models/yolov8n_320.onnx
          test -s .generated/mobile_model_manifest.json
          test -s .generated/branding_manifest.json
          test -s .generated/wvab_launcher.png
          test -s .generated/wvab_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          blocked_old = {
              'wvab_launcher.png': 'b1a3b209775db713543a5c81ab28212edcf5c2dcfe39a60d33f917f03315296a',
              'wvab_launcher_foreground.png': 'ad4cbb708b8aa3380129c7c65fc0ecc4409dce2d4fdf4ebe8d83847e9a8caf69',
          }
          branding_manifest = json.loads(Path('.generated/branding_manifest.json').read_text())
          for key, filename in (
              ('launcher', 'wvab_launcher.png'),
              ('foreground', 'wvab_launcher_foreground.png'),
          ):
              path = Path('.generated') / filename
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = branding_manifest[key]['sha256']
              if actual != expected:
                  raise SystemExit(f'{path} does not match committed-source manifest: {actual}')
              if actual == blocked_old[filename]:
                  raise SystemExit(f'{path} regressed to the old deterministic launcher icon')
              if (branding_manifest[key]['width'], branding_manifest[key]['height']) != (192, 192):
                  raise SystemExit(f'{path} has unexpected dimensions')

          manifest = json.loads(Path('.generated/mobile_model_manifest.json').read_text())
          model = Path('assets/models/yolov8n_320.onnx')
          digest = hashlib.sha256(model.read_bytes()).hexdigest()
          if digest != manifest['asset_sha256']:
              raise SystemExit('Packaged ONNX model checksum does not match export manifest')
          if manifest['input_shape'] != [1, 3, 320, 320]:
              raise SystemExit(f"Unexpected model input shape: {manifest['input_shape']}")
          if 84 not in manifest['output_shape'][1:]:
              raise SystemExit(f"Unexpected model output shape: {manifest['output_shape']}")
          PY

      - name: Build split standalone debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-debug.apk
          test "$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk)" -lt 209715200

      - name: Upload standalone debug APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wvab-mobile-standalone-debug-${{ github.sha }}
          path: mobile/flutter/build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish rebuilt arm64 demo to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'mobile-demo-new-icon-rebuild' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          target="demo/wvab-mobile-demo-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk "$target"
          sha256sum "$target" | sed 's#  demo/#  #' > demo/SHA256SUMS.txt
          cat > demo/README.md <<'EOF'
          # WVAB Mobile Demo APK

          `wvab-mobile-demo-arm64-v8a.apk` is the freshly rebuilt Android debug demo for 64-bit ARM devices.

          - Launcher icon: restored from the committed WVAB branding source under `tool/branding/`
          - Languages: English, Bangla, Russian, Hindi
          - Build type: Flutter debug APK
          - ABI: arm64-v8a
          - Minimum Android SDK: 24
          - Validation: Flutter analyze, widget tests, Android host contract checks, launcher-branding source validation, split APK build and APK verification all pass before publication.

          Verify the APK against `SHA256SUMS.txt` after download.

          Secure UDP Protocol v2 mobile streaming and object inference are not represented as active until implemented and validated. This is an assistive prototype, not a certified navigation or safety device.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/README.md demo/SHA256SUMS.txt "$target"
          if git diff --cached --quiet; then
            echo "Demo APK is already current."
            exit 0
          fi
          git commit -m "Publish rebuilt WVAB demo with restored launcher icon [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
