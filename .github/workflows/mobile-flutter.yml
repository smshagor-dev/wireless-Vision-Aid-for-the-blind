name: Mobile Flutter

on:
  push:
    branches:
      - main
      - mobile-layout-responsive-fix
    paths:
      - mobile/flutter/**
      - .github/workflows/mobile-flutter.yml
  pull_request:
    paths:
      - mobile/flutter/**
      - .github/workflows/mobile-flutter.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-mobile:
    name: Flutter analyze, test, and debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Generate Android host project
        run: bash tool/bootstrap_android.sh

      - name: Verify Android security and SDK contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'minSdk = 24' android/app/build.gradle.kts >/dev/null
          grep -F 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml >/dev/null

      - name: Build split debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-debug.apk
          test "$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk)" -lt 104857600

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wvab-mobile-debug-${{ github.sha }}
          path: mobile/flutter/build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish redesigned arm64 demo APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/mobile-layout-responsive-fix'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk demo/wvab-mobile-demo-arm64-v8a.apk
          sha256sum demo/wvab-mobile-demo-arm64-v8a.apk | sed 's#  demo/#  #' > demo/SHA256SUMS.txt
          cat > demo/README.md <<'EOF'
          # WVAB Mobile Demo APK

          `wvab-mobile-demo-arm64-v8a.apk` is the CI-built Android debug demo for 64-bit ARM devices.

          - UI: WVAB navy/green multilingual redesign
          - Languages: English, Bangla, Russian, Hindi
          - Build type: Flutter debug APK
          - ABI: arm64-v8a
          - Minimum Android SDK: 24
          - Validation: Flutter analyze, widget tests, Android host contract checks, split APK build and APK verification all pass before publication.

          Verify the APK against `SHA256SUMS.txt` after download.

          Secure UDP Protocol v2 mobile streaming and object inference are not represented as active until implemented and validated. This is an assistive prototype, not a certified navigation or safety device.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/wvab-mobile-demo-arm64-v8a.apk demo/SHA256SUMS.txt demo/README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh redesigned mobile demo APK [skip ci]"
          git push origin HEAD:mobile-layout-responsive-fix
