name: Mobile Flutter

on:
  push:
    branches:
      - main
    paths:
      - mobile/flutter/**
      - yolov8n.pt
      - .github/workflows/mobile-flutter.yml
  pull_request:
    paths:
      - mobile/flutter/**
      - yolov8n.pt
      - .github/workflows/mobile-flutter.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-mobile:
    name: Flutter analyze, test, and standalone release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mobile/flutter/tool/model-export-requirements.txt

      - name: Install pinned mobile model exporter
        run: python -m pip install --disable-pip-version-check -r tool/model-export-requirements.txt

      - name: Export and validate offline ONNX model
        run: python tool/export_mobile_model.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify v1.0.0 dependency contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 1.0.0+8' pubspec.yaml >/dev/null
          grep -Fx '  camera_android: 0.10.11' pubspec.yaml >/dev/null
          grep -Fx '  flutter_onnxruntime: 1.7.1' pubspec.yaml >/dev/null
          if grep -Eq '^version: 1\.0\.[12]' pubspec.yaml; then
            echo 'Unexpected app version bump detected.' >&2
            exit 1
          fi

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Generate Android host project and launcher branding
        run: bash tool/bootstrap_android.sh

      - name: Verify Android, branding, TTS, and offline-model contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'minSdk = 24' android/app/build.gradle.kts >/dev/null
          grep -F 'isMinifyEnabled = false' android/app/build.gradle.kts >/dev/null
          grep -F 'isShrinkResources = false' android/app/build.gradle.kts >/dev/null
          grep -F 'proguard-rules.pro' android/app/build.gradle.kts >/dev/null
          grep -F -- '-keep class ai.onnxruntime.** { *; }' android/app/proguard-rules.pro >/dev/null
          grep -F -- '-keepclasseswithmembernames class *' android/app/proguard-rules.pro >/dev/null
          grep -F 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:label="WVAB"' android/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'assets/models/' pubspec.yaml >/dev/null
          test -s assets/models/yolov8n_320.onnx
          test -s .generated/mobile_model_manifest.json
          test -s .generated/branding_manifest.json
          test -s .generated/wvab_launcher.png
          test -s .generated/wvab_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          blocked_old = {
              'wvab_launcher.png': 'b1a3b209775db713543a5c81ab28212edcf5c2dcfe39a60d33f917f03315296a',
              'wvab_launcher_foreground.png': 'ad4cbb708b8aa3380129c7c65fc0ecc4409dce2d4fdf4ebe8d83847e9a8caf69',
          }
          branding_manifest = json.loads(Path('.generated/branding_manifest.json').read_text())
          for key, filename in (
              ('launcher', 'wvab_launcher.png'),
              ('foreground', 'wvab_launcher_foreground.png'),
          ):
              path = Path('.generated') / filename
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = branding_manifest[key]['sha256']
              if actual != expected:
                  raise SystemExit(f'{path} does not match committed-source manifest: {actual}')
              if actual == blocked_old[filename]:
                  raise SystemExit(f'{path} regressed to the old deterministic launcher icon')
              if (branding_manifest[key]['width'], branding_manifest[key]['height']) != (192, 192):
                  raise SystemExit(f'{path} has unexpected dimensions')

          manifest = json.loads(Path('.generated/mobile_model_manifest.json').read_text())
          model = Path('assets/models/yolov8n_320.onnx')
          digest = hashlib.sha256(model.read_bytes()).hexdigest()
          if digest != manifest['asset_sha256']:
              raise SystemExit('Packaged ONNX model checksum does not match export manifest')
          if manifest['input_shape'] != [1, 3, 320, 320]:
              raise SystemExit(f"Unexpected model input shape: {manifest['input_shape']}")
          if manifest['classes'] != 80:
              raise SystemExit(f"Unexpected model class count: {manifest['classes']}")
          if 84 not in manifest['output_shape'][1:]:
              raise SystemExit(f"Unexpected model output shape: {manifest['output_shape']}")
          PY

      - name: Build split standalone release APKs
        run: flutter build apk --release --split-per-abi

      - name: Inspect v1.0.0 release APK and native runtime
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          test -s "$apk"
          size="$(stat -c%s "$apk")"
          echo "arm64 release APK size: $size bytes"
          test "$size" -lt 104857600

          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libonnxruntime.so' >/dev/null
          unzip -l "$apk" | grep -F 'assets/flutter_assets/assets/models/yolov8n_320.onnx' >/dev/null
          unzip -p "$apk" lib/arm64-v8a/libonnxruntime.so > /tmp/libonnxruntime.so
          file /tmp/libonnxruntime.so | grep -E 'ELF 64-bit.*ARM aarch64|ELF 64-bit.*aarch64' >/dev/null
          readelf -d /tmp/libonnxruntime.so > /tmp/onnxruntime.dynamic.txt
          if grep -Eq 'libc\.so\.6|libstdc\+\+\.so\.6|ld-linux|librt\.so\.1|libdl\.so\.2' /tmp/onnxruntime.dynamic.txt; then
            echo 'Wrong-platform Linux/glibc ONNX Runtime dependency found in Android APK.' >&2
            cat /tmp/onnxruntime.dynamic.txt >&2
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$apk" > /tmp/wvab.badging.txt
          grep -F "versionName='1.0.0'" /tmp/wvab.badging.txt >/dev/null
          grep -F "package: name='com.smshagor.wvab_mobile'" /tmp/wvab.badging.txt >/dev/null

      - name: Verify all release APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload standalone v1.0.0 release APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wvab-mobile-v1.0.0-release-${{ github.sha }}
          path: mobile/flutter/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 7
