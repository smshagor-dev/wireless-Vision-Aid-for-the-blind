name: CI

on:
  push:
    branches:
      - main
      - production-readiness-hardening
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Validate package metadata
        run: python -m pip install --no-deps .

      - name: Compile Python source
        run: python -m compileall -q -x '(^|/)(cpp/build|__pycache__)(/|$)' .

      - name: Validate shell scripts
        shell: bash
        run: bash -n quick_start.sh deployment/rpi/*.sh

      - name: Validate lightweight CLIs
        run: |
          python tools/generate_device_secrets.py --help >/dev/null
          python tools/download_models.py --help >/dev/null
          python test_system.py --help >/dev/null
          python main.py --help >/dev/null
          python smartphone_camera.py --help >/dev/null

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(__pycache__/|cpp/build/)|\.pyc$|\.log$' || true)
          if [[ -n "$bad" ]]; then
            echo "Generated artifacts are tracked:"
            echo "$bad"
            exit 1
          fi
          secrets=$(git ls-files | grep -E '(^|/)esp32_secrets\.h$|^deployment/rpi/wvab_edge\.env$' || true)
          if [[ -n "$secrets" ]]; then
            echo "Local credential files are tracked:"
            echo "$secrets"
            exit 1
          fi
          grep -Fx 'esp32_secrets.h' .dockerignore >/dev/null
          grep -Fx 'deployment/rpi/wvab_edge.env' .dockerignore >/dev/null
          grep -Eq '^USER[[:space:]]+wvab$' Dockerfile
          if git grep -n -E 'WVAB_UDP_AUTH[=:][[:space:]]*0|0102030405060708090A0B0C0D0E0F10' -- ':!*.example.*'; then
            echo "Insecure deployment default found in tracked source/docs."
            exit 1
          fi
          if git grep -n -E 'distance_m|about .* meters' -- vision_server.py smartphone_camera.py; then
            echo "Uncalibrated metric-distance language reintroduced in local vision runtime."
            exit 1
          fi
