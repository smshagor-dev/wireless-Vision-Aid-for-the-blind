name: CI

on:
  push:
    branches:
      - main
      - production-readiness-hardening
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Compile source
        run: python -m compileall -q -x '(^|/)(cpp/build|__pycache__)(/|$)' .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(__pycache__/|cpp/build/)|\.pyc$|\.log$' || true)
          if [[ -n "$bad" ]]; then
            echo "Generated artifacts are tracked:"
            echo "$bad"
            exit 1
          fi
