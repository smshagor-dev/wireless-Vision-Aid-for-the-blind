name: CI

on:
  push:
    branches:
      - main
      - production-readiness-hardening
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-ci.txt

      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist-ci

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist-ci").glob("wvab_system-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one WVAB wheel, found: {wheels}")
          required = {
              "assets/fonts/NotoSansBengali-Regular.ttf",
              "assets/fonts/NotoSansDevanagari-Regular.ttf",
              "assets/fonts/NotoNaskhArabic-Regular.ttf",
              "core/config.py",
              "core/udp_protocol.py",
              "core/udp_runtime.py",
              "mapping/occupancy_grid.py",
              "navigation/a_star.py",
              "perception/depth_estimator.py",
              "training/runtime_validation.py",
              "tools/download_models.py",
              "vision_server.py",
              "udp_streaming.py",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing internal modules/assets: {missing}")
          PY

      - name: Validate package install
        run: python -m pip install --no-deps --force-reinstall dist-ci/wvab_system-*.whl

      - name: Validate installed package outside checkout
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          (
            cd "$tmpdir"
            python - <<'PY'
          from importlib.resources import files
          from core.udp_protocol import HEADER_SIZE, pack_header, unpack_header
          from core.udp_runtime import _new_session_id

          session_id = _new_session_id()
          header = pack_header(session_id, 1, 1, 0, 32)
          assert HEADER_SIZE == 14
          assert unpack_header(header) == (session_id, 1, 1, 0, 32)
          assert files("assets").joinpath("fonts/NotoSansBengali-Regular.ttf").is_file()
          PY
          )

      - name: Compile Python source
        run: python -m compileall -q -x '(^|/)(cpp/build|__pycache__)(/|$)' .

      - name: Validate shell scripts
        shell: bash
        run: bash -n quick_start.sh deployment/docker_start.sh deployment/rpi/*.sh

      - name: Validate lightweight CLIs
        run: |
          python tools/generate_device_secrets.py --help >/dev/null
          python tools/download_models.py --help >/dev/null
          python tools/soak_monitor.py --help >/dev/null
          python tools/summarize_soak.py --help >/dev/null
          python test_system.py --help >/dev/null
          python main.py --help >/dev/null
          python smartphone_camera.py --help >/dev/null
          python udp_streaming.py --help >/dev/null
          python train_navigation_model.py --help >/dev/null
          python export_accelerated_models.py --help >/dev/null

      - name: Validate ESP32 secure protocol contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("esp32_cam_stream.ino").read_text(encoding="utf-8")
          calls = re.findall(
              r"mbedtls_gcm_crypt_and_tag\([\s\S]*?header,\s*HEADER_SIZE,",
              source,
          )
          if len(calls) != 2:
              raise SystemExit("ESP32 auth/frame encryption must authenticate the UDP header as GCM AAD")
          if "esp_http_server" in source or "startCameraServer" in source:
              raise SystemExit("Unauthenticated ESP32 MJPEG fallback must not be present in the release firmware")
          if "const uint16_t HEADER_SIZE = 14;" not in source:
              raise SystemExit("ESP32 secure UDP header must include the 32-bit session identifier")
          if "uint32_t session_id = 0;" not in source or "session_id = esp_random();" not in source:
              raise SystemExit("ESP32 must generate a fresh non-zero session id at boot")
          if "build_header(header, session_id, AUTH_FRAME_ID" not in source:
              raise SystemExit("ESP32 authentication packet must bind its session id")
          if "udp.write(base_nonce, NONCE_SIZE);" not in source:
              raise SystemExit("ESP32 encrypted packets must carry their frame base nonce")
          PY

      - name: Validate container deployment contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'command: ["bash", "deployment/rpi/wvab_edge_start.sh"]' docker-compose.yml >/dev/null
          grep -F '${WVAB_UDP_PORT:-9999}:${WVAB_UDP_PORT:-9999}/udp' docker-compose.yml >/dev/null
          grep -F 'docker compose --env-file "$ENV_FILE"' deployment/docker_start.sh >/dev/null
          if git grep -n -E 'WVAB_UDP_WATCHDOG_SERVER_IDLE_S|WVAB_UDP_WATCHDOG_CLIENT_IDLE_S' -- wvab_config.sample.json docker-compose.yml deployment; then
            echo "Obsolete watchdog variable remains in deployment/config files."
            exit 1
          fi

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(__pycache__/|cpp/build/)|\.pyc$|\.log$' || true)
          if [[ -n "$bad" ]]; then
            echo "Generated artifacts are tracked:"
            echo "$bad"
            exit 1
          fi
          secrets=$(git ls-files | grep -E '(^|/)esp32_secrets\.h$|^deployment/rpi/wvab_edge\.env$' || true)
          if [[ -n "$secrets" ]]; then
            echo "Local credential files are tracked:"
            echo "$secrets"
            exit 1
          fi
          grep -Fx 'esp32_secrets.h' .dockerignore >/dev/null
          grep -Fx 'deployment/rpi/wvab_edge.env' .dockerignore >/dev/null
          grep -Eq '^USER[[:space:]]+wvab$' Dockerfile
          if git grep -n -E 'WVAB_UDP_AUTH[=:][[:space:]]*0|0102030405060708090A0B0C0D0E0F10' -- ':!*.example.*' ':!.github/workflows/ci.yml'; then
            echo "Insecure deployment default found in tracked source/docs."
            exit 1
          fi
          if git grep -n -E 'distance_m|about .* meters' -- vision_server.py smartphone_camera.py; then
            echo "Uncalibrated metric-distance language reintroduced in local vision runtime."
            exit 1
          fi
          if [[ -e training/train_custom.py || -e camera_gui.py || -e dashboard_tk.py ]]; then
            echo "Unsupported legacy runtime/training entrypoint reintroduced."
            exit 1
          fi

  cpp-build:
    name: C++17 planner build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S cpp -B build-cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cpp --config Release --parallel 2

      - name: Run planner demo
        run: ./build-cpp/navigation_demo

  esp32-firmware:
    name: ESP32-CAM firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Prepare deterministic sketch directory
        run: |
          mkdir -p build-sketch/esp32_cam_stream
          cp esp32_cam_stream.ino build-sketch/esp32_cam_stream/esp32_cam_stream.ino
          cp esp32_secrets.example.h build-sketch/esp32_cam_stream/esp32_secrets.example.h

      - name: Compile ESP32-CAM firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32:PSRAM=enabled build-sketch/esp32_cam_stream
