name: CI

on:
  push:
    branches:
      - main
      - production-readiness-hardening
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-ci.txt

      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist-ci

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist-ci").glob("wvab_system-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one WVAB wheel, found: {wheels}")
          required = {
              "core/config.py",
              "mapping/occupancy_grid.py",
              "navigation/a_star.py",
              "perception/depth_estimator.py",
              "training/runtime_validation.py",
              "tools/download_models.py",
              "vision_server.py",
              "udp_streaming.py",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing internal modules: {missing}")
          PY

      - name: Validate package install
        run: python -m pip install --no-deps --force-reinstall dist-ci/wvab_system-*.whl

      - name: Compile Python source
        run: python -m compileall -q -x '(^|/)(cpp/build|__pycache__)(/|$)' .

      - name: Validate shell scripts
        shell: bash
        run: bash -n quick_start.sh deployment/rpi/*.sh

      - name: Validate lightweight CLIs
        run: |
          python tools/generate_device_secrets.py --help >/dev/null
          python tools/download_models.py --help >/dev/null
          python test_system.py --help >/dev/null
          python main.py --help >/dev/null
          python smartphone_camera.py --help >/dev/null
          python train_navigation_model.py --help >/dev/null
          python export_accelerated_models.py --help >/dev/null

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(__pycache__/|cpp/build/)|\.pyc$|\.log$' || true)
          if [[ -n "$bad" ]]; then
            echo "Generated artifacts are tracked:"
            echo "$bad"
            exit 1
          fi
          secrets=$(git ls-files | grep -E '(^|/)esp32_secrets\.h$|^deployment/rpi/wvab_edge\.env$' || true)
          if [[ -n "$secrets" ]]; then
            echo "Local credential files are tracked:"
            echo "$secrets"
            exit 1
          fi
          grep -Fx 'esp32_secrets.h' .dockerignore >/dev/null
          grep -Fx 'deployment/rpi/wvab_edge.env' .dockerignore >/dev/null
          grep -Eq '^USER[[:space:]]+wvab$' Dockerfile
          if git grep -n -E 'WVAB_UDP_AUTH[=:][[:space:]]*0|0102030405060708090A0B0C0D0E0F10' -- ':!*.example.*'; then
            echo "Insecure deployment default found in tracked source/docs."
            exit 1
          fi
          if git grep -n -E 'distance_m|about .* meters' -- vision_server.py smartphone_camera.py; then
            echo "Uncalibrated metric-distance language reintroduced in local vision runtime."
            exit 1
          fi
          if [[ -e training/train_custom.py || -e camera_gui.py || -e dashboard_tk.py ]]; then
            echo "Unsupported legacy runtime/training entrypoint reintroduced."
            exit 1
          fi
