name: Publish WVAB v1.0.1 Demo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.1-demo.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Download validated v1.0.1 release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/wvab-v1.0.1
          mkdir -p /tmp/wvab-v1.0.1
          gh run download 32927238155 \
            --repo "$GITHUB_REPOSITORY" \
            --name "wvab-mobile-standalone-release-98bc3832a0f8cd40b72784a3d126002448831bad" \
            --dir /tmp/wvab-v1.0.1
          test -s /tmp/wvab-v1.0.1/app-arm64-v8a-release.apk

      - name: Publish v1.0.1 APK to repository demo
        run: |
          set -euo pipefail
          grep -F 'version: 1.0.1+7' mobile/flutter/pubspec.yaml >/dev/null
          target="mobile/flutter/demo/wvab-mobile-demo-arm64-v8a.apk"
          cp /tmp/wvab-v1.0.1/app-arm64-v8a-release.apk "$target"
          cd mobile/flutter
          sha256sum demo/wvab-mobile-demo-arm64-v8a.apk | sed 's#  demo/#  #' > demo/SHA256SUMS.txt
          cat > demo/README.md <<'EOF'
          # WVAB Mobile v1.0.1 Camera-Stability Demo APK

          `wvab-mobile-demo-arm64-v8a.apk` is the WVAB Mobile **v1.0.1** Android release demo for 64-bit ARM devices.

          - App version: 1.0.1 (build 7)
          - Camera lifecycle start/stop operations are serialized.
          - Stale camera permission/initialization sessions are invalidated before they can reuse disposed controllers.
          - Camera preview is established before ONNX inference initialization begins.
          - ONNX Runtime uses the CPU provider for device-stable native execution.
          - Camera and ESP32 teardown is defensive and idempotent.
          - Inference is throttled to reduce camera/native runtime pressure.
          - All 80 COCO classes supported by the bundled YOLOv8n model remain enabled by default.
          - Current restored WVAB launcher branding is retained.
          - Build type: optimized Flutter release APK.
          - ABI: arm64-v8a.
          - Minimum Android SDK: 24.

          This build specifically addresses the process crash observed when opening the phone camera.

          Verify the APK against `SHA256SUMS.txt` after download.
          EOF
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/flutter/demo/README.md mobile/flutter/demo/SHA256SUMS.txt "$target"
          git commit -m "Publish WVAB mobile v1.0.1 camera-stability demo [skip ci]"
          git push origin HEAD:main
