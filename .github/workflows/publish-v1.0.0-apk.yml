name: Publish verified v1.0.0 APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.0-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download already-green v1.0.0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wvab-v1.0.0
          gh run download 32929761223 \
            --repo "$GITHUB_REPOSITORY" \
            --name 'wvab-mobile-v1.0.0-release-e44acd4b736d1a175b6033d7746496a4489d9e26' \
            --dir /tmp/wvab-v1.0.0
          test -s /tmp/wvab-v1.0.0/app-arm64-v8a-release.apk
          echo '4458ab48b75d9218cb3e8459a31ae77f66297ad4b73f50b2ef68d8133d12ab37  /tmp/wvab-v1.0.0/app-arm64-v8a-release.apk' | sha256sum -c -

      - name: Publish arm64 APK and checksum
        run: |
          set -euo pipefail
          mkdir -p mobile/flutter/demo
          cp /tmp/wvab-v1.0.0/app-arm64-v8a-release.apk mobile/flutter/demo/wvab-mobile-demo-arm64-v8a.apk
          cat > mobile/flutter/demo/SHA256SUMS.txt <<'EOF'
          4458ab48b75d9218cb3e8459a31ae77f66297ad4b73f50b2ef68d8133d12ab37  wvab-mobile-demo-arm64-v8a.apk
          EOF
          cat > mobile/flutter/demo/README.md <<'EOF'
          # WVAB Mobile v1.0.0 Demo APK

          This directory contains the verified Android arm64-v8a demo build for WVAB Mobile **v1.0.0**.

          - App version: `1.0.0`
          - ABI: `arm64-v8a`
          - APK: `wvab-mobile-demo-arm64-v8a.apk`
          - SHA256: `4458ab48b75d9218cb3e8459a31ae77f66297ad4b73f50b2ef68d8133d12ab37`
          - CI source run: `32929761223`
          - Detection model: bundled YOLOv8n 320 ONNX, 80 COCO classes
          - Android ONNX Runtime: forced to 1.22.0 with the Kotlin-safe Flutter wrapper

          The CI gate verified Dart analysis, 31 Flutter tests including detection-to-speech invocation, Android/TTS/ProGuard contracts, resolved ONNX Runtime dependency, release APK build, arm64 native ELF packaging, bundled model presence, and `versionName=1.0.0`.

          Physical phone camera/speaker behavior still depends on the target Android device and cannot be proven by GitHub Actions alone.
          EOF

      - name: Commit verified v1.0.0 demo APK
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/flutter/demo/wvab-mobile-demo-arm64-v8a.apk mobile/flutter/demo/SHA256SUMS.txt mobile/flutter/demo/README.md
          if git diff --cached --quiet; then
            echo 'Verified v1.0.0 APK is already published.'
            exit 0
          fi
          git commit -m 'Publish WVAB mobile v1.0.0 verified demo APK [skip ci]'
          git push origin HEAD:main
